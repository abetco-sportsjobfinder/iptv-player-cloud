<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<title>PRISM TV — Live, grouped, everywhere</title>
<meta name="description" content="Free IPTV browser: 40k+ channels grouped by letter and brand, multi-view, working-status tracking." />
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</head>
<body>

<div id="boot" class="boot">
  <div class="prism-loader">
    <div class="pl-diamond"><span></span></div>
    <div class="boot-mark">◇ PRISM TV</div>
    <div id="bootMsg">Initializing…</div>
    <div class="pl-bar"><i></i></div>
    <div class="pl-dots"><span>•</span><span>•</span><span>•</span><span>•</span></div>
  </div>
</div>
<!-- boot loader by ses_fd7f96d0 - see COORDINATION.md staging protocol before git add -->
<script>
(function(){
  var b = document.getElementById('boot');
  if (!b || b.dataset.loaderBound) return;
  b.dataset.loaderBound = '1';
  var done = false;
  function finish(){
    if (done) return;
    done = true;
    b.classList.add('done');
    var ms = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 420;
    setTimeout(function(){ b.remove(); }, ms);
  }
  b.remove = finish; /* path A: main.js calls .remove() */
  new MutationObserver(function(){ /* path B: degrade silently if owner stops using .remove() */
    if (!done && (getComputedStyle(b).display === 'none' || !b.isConnected)) done = true;
  }).observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['style','class']});
})();
</script>

<header class="topbar">
  <button id="sidebarToggle" class="icon-btn" aria-label="Toggle sidebar">☰</button>
  <a class="brand" href="#/"><span class="brand-mark">◇</span> PRISM<span class="brand-tv">TV</span></a>
  <input id="search" type="search" placeholder="Search 40,000+ channels…   ( / )" autocomplete="off" spellcheck="false" oninput="handleSearchInput()"/>
  <span id="statusChip" class="status-chip" title="Confirmed working vs tested channels">counting…</span>
  <button id="mvBtn" class="icon-btn" title="Multi-view dock" aria-label="Multi-view dock">
    ⧉ <span id="mvCount" class="mv-badge">0</span>
  </button>
  <button id="profileBtn" class="avatar-btn" aria-label="Profile">🐺</button>
  <button id="simpleModeBtn" class="icon-btn" aria-label="Simple/Toggle Advanced Mode">A</button>
</header>

<div id="app">
  <nav id="tree" class="sidebar" aria-label="Channel groups">
    <div id="modePills" style="display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap;">
      <button class="chip on" data-view="quad" onclick="setViewMode('quad')">Quad</button>
      <button class="chip" data-view="single" onclick="setViewMode('single')">Single</button>
      <button class="chip" data-view="favorites" onclick="setViewMode('favorites')">Favorites</button>
    </div>
  </nav>
  <main class="main">
    <section id="hero" class="hero" aria-label="Featured channel"></section>
    <div class="scope-row">
      <h1 id="scopeTitle">Browse All</h1>
      <span id="resultCount" class="result-count"></span>
    </div>
    <div id="chips" class="chips" role="tablist" aria-label="Category filter"></div>
    <div id="grid" class="grid" aria-live="polite"></div>
  </main>
</div>

<div id="mvDock" class="mv-dock">
  <div class="mv-head">
    <span>MULTI-VIEW (<span id="mvCount2">0</span>)</span>
    <button id="mvClear" class="link-btn">clear all</button>
  </div>
</div>

<dialog id="watch" class="watch" aria-label="Now playing">
  <div class="watch-head">
    <div>
      <h3 id="wTitle">Channel</h3>
      <div id="wMeta" class="watch-meta"></div>
    </div>
    <button id="wClose" class="icon-btn" aria-label="Close player">✕</button>
  </div>
  <video id="video" controls autoplay playsinline></video>
  <div class="watch-bar">
    <span id="playerMsg" class="player-msg"></span>
    <span id="wStatusReason" class="player-msg dim"></span>
    <span class="spacer"></span>
    <button id="wFav" class="btn-ghost">☆ Favorite</button>
    <button id="wTest" class="btn-ghost">Test status</button>
    <button id="wMulti" class="btn-accent">+ Multi-view</button>
  </div>
  <div id="wRelated" class="related"></div>
</dialog>

<dialog id="profilePop" class="profile-pop" aria-label="Profile & settings">
  <h3>Profile &amp; Settings</h3>
  <label class="field">Display name
    <input id="profName" maxlength="24" placeholder="Your name" />
  </label>
  <div class="field">Avatar
    <div id="profAvatars" class="av-row"></div>
  </div>
  <div class="field-row">
    <label class="field">Theme
      <select id="profTheme">
        <option value="dark">Dark</option>
        <option value="midnight">Midnight (OLED)</option>
        <option value="slate">Slate</option>
      </select>
    </label>
    <label class="field">Accent
      <select id="profAccent">
        <option value="indigo">Indigo</option>
        <option value="cyan">Cyan</option>
        <option value="violet">Violet</option>
        <option value="lime">Lime</option>
        <option value="amber">Amber</option>
        <option value="rose">Rose</option>
      </select>
    </label>
  </div>
  <p class="hint">Favorites and stream statuses sync across your devices via the shared proxy.</p>
  <button id="profClose" class="btn-accent">Done</button>
</dialog>

<script type="module" src="/js/main.js"></script>
</body>
</html>
