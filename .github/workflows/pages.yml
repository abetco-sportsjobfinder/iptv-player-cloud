name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: iptv-player-pro
          directory: .

      - name: Deploy proxy worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-worker.mjs

      - name: Verify live endpoints
        run: |
          set -e
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://iptv-stream-proxy.abetscrape.workers.dev/api/sources")
          echo "sources no-device -> $code (expect 400)"
          test "$code" = "400"
          curl -sf "https://iptv-player-pro.pages.dev/js/grandma.js" > /dev/null
          echo "frontend markers: OK"
